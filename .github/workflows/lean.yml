name: Lean 4 & Exact Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean 4 toolchain and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"
          build: "false"
          test: "false"
          lint: "false"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SymPy for exact arithmetic verifier
        run: python3 -m pip install --upgrade pip && python3 -m pip install sympy

      - name: Run strict Lean 4 build, all-owned axiom audit, and leanchecker replay
        env:
          LEAN_NUM_THREADS: "1"
        run: python3 scripts/verify-lean.py

      - name: Run standalone exact rational & symbolic verifier
        run: python3 verify.py
